<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS — Autonomous AI Agent Workspace</title>
    <meta
      name="description"
      content="Autonomous AI agent workspace with multi-provider Gemini and Groq routing, tool execution, and persistent task memory."
    />
    <meta property="og:title" content="NEXUS — Autonomous AI Agent Workspace" />
    <meta
      property="og:description"
      content="Autonomous AI agent workspace with multi-provider Gemini and Groq routing, tool execution, and persistent task memory."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nexus-theme');
          var parsed = raw ? JSON.parse(raw) : null;
          var mode = parsed && parsed.state && parsed.state.mode ? parsed.state.mode : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
